name: Android emulator smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'scripts/android_emulator_smoke.sh'

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Enable KVM access
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo 'KVM unavailable: emulator action will attempt software acceleration.'
          fi

      - name: Boot Android 35 AVD and verify adb
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, pinned
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: hongguo-research-ci
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-linux-hw-accel: auto
          script: bash scripts/android_emulator_smoke.sh

      - name: Upload device-info and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke
          path: output/android_emulator_smoke/
          if-no-files-found: warn
          retention-days: 7
