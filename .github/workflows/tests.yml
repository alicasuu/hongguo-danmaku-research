name: Source and OCR tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test crawler and data pipeline
        run: python -m unittest discover -s tests -v
      - name: Test offline OCR tracking
        run: python -m unittest discover -s experiments/quicktime_ocr -p 'test_*.py' -v
